<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minha Estante</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MinhaEstante" />
<link rel="apple-touch-icon" href="./icons/icon-192x192.png" />
<style>
  /* ── Tokyo Night (dark) ── */
  :root, [data-theme="dark"] {
    --paper: #1a1b26;
    --cream: #24283b;
    --card: #1f2335;
    --card2: #24283b;
    --border: #292e42;
    --border-light: #3b4261;
    --text: #c0caf5;
    --text-dim: #565f89;
    --accent: #f7768e;
    --accent-light: #2d1f26;
    --green: #9ece6a;
    --green-light: #1a2b1a;
    --amber: #e0af68;
    --amber-light: #2a2018;
    --blue-tn: #7aa2f7;
    --blue-tn-light: #1a2b3c;
    --header-bg: #16161e;
    --shadow: 0 2px 8px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.25);
    --shadow-card: 0 1px 3px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.2);
    --radius: 16px;
    --radius-sm: 10px;
    --radius-pill: 50px;
    --setup-bg: #24283b;
    --setup-border: #414868;
    --setup-text: #a9b1d6;
    --setup-input-bg: #1a1b26;
    --nav-height: 68px;
  }

  /* ── Paleta Personalizada (light) ── */
  [data-theme="light"] {
    --paper: #FCF9EA;
    --cream: #FCF9EA;
    --card: #FCF9EA;
    --card2: #FCF9EA;
    --border: #BADFDB;
    --border-light: #9ecfcb;
    --text: #3d2b1f;
    --text-dim: #7a5c4e;
    --accent: #FFA4A4;
    --accent-light: #FFBDBD;
    --green: #5a9e6f;
    --green-light: #e8f7f0;
    --amber: #c47c2b;
    --amber-light: #fdebd0;
    --blue-tn: #5b8fd4;
    --blue-tn-light: #ddeefa;
    --header-bg: #BADFDB;
    --shadow: 0 2px 8px rgba(186,223,219,0.4), 0 4px 20px rgba(186,223,219,0.2);
    --shadow-card: 0 1px 4px rgba(186,223,219,0.5), 0 4px 16px rgba(186,223,219,0.3);
    --radius: 16px;
    --radius-sm: 10px;
    --radius-pill: 50px;
    --setup-bg: #FFBDBD;
    --setup-border: #FFA4A4;
    --setup-text: #3d2b1f;
    --setup-input-bg: #FCF9EA;
    --nav-height: 68px;
  }

  /* cards e seções sem fundo no light — só a borda de destaque */
  [data-theme="light"] .book-card,
  [data-theme="light"] .pages-card,
  [data-theme="light"] .goal-card,
  [data-theme="light"] .stat,
  [data-theme="light"] .pages-breakdown-item,
  [data-theme="light"] .year-chip,
  [data-theme="light"] .quick-progress,
  [data-theme="light"] .estimate-row {
    background: transparent;
    border-color: #BADFDB;
  }

  [data-theme="light"] .book-card:hover {
    background: #f0faf9;
    box-shadow: 0 4px 20px rgba(186,223,219,0.5);
  }

  [data-theme="light"] .progress-track,
  [data-theme="light"] .goal-bar-track {
    background: #BADFDB;
  }

  [data-theme="light"] .pages-tabs,
  [data-theme="light"] .tabs {
    border-bottom-color: #BADFDB;
  }

  [data-theme="light"] .modal {
    background: #FCF9EA;
    border-color: #BADFDB;
  }

  [data-theme="light"] .field input,
  [data-theme="light"] .field select {
    background: #FCF9EA;
    border-color: #BADFDB;
  }

  [data-theme="light"] .field input:focus,
  [data-theme="light"] .field select:focus {
    border-color: #FFA4A4;
  }

  [data-theme="light"] header {
    border-bottom-color: #9ecfcb;
  }

  [data-theme="light"] .year-chip.active-year {
    background: #FFBDBD;
    border-color: #FFA4A4;
  }

  [data-theme="light"] .goal-set input,
  [data-theme="light"] .pages-add-input,
  [data-theme="light"] .pages-add-book-select {
    background: #FCF9EA;
    border-color: #BADFDB;
  }

  [data-theme="light"] .search-bar {
    background: rgba(186,223,219,0.25);
    border-color: #BADFDB;
  }
  [data-theme="light"] .search-bar:focus-within {
    border-color: #FFA4A4;
    background: #FCF9EA;
  }
  [data-theme="light"] .search-bar input { color: #3d2b1f; }
  [data-theme="light"] .search-bar input::placeholder { color: #9ecfcb; }

  [data-theme="light"] .bottom-nav {
    background: rgba(252,249,234,0.92);
    border-top-color: #BADFDB;
  }
  [data-theme="light"] .fab { box-shadow: 0 4px 20px rgba(255,164,164,0.5); }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));
    -webkit-tap-highlight-color: transparent;
  }

  header {
    background: var(--header-bg);
    color: var(--text);
    padding: 0 1.25rem;
    padding-top: env(safe-area-inset-top, 0px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: calc(56px + env(safe-area-inset-top, 0px));
    position: sticky;
    top: 0;
    z-index: 50;
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .logo { font-family: 'Playfair Display', serif; font-size: 20px; letter-spacing: 0.02em; color: var(--text); }
  .logo span { color: #d63333; font-style: italic; }
  .btn-theme {
    background: var(--cream); border: 1px solid var(--border-light);
    border-radius: var(--radius-pill); width: 36px; height: 36px;
    font-size: 16px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; transition: all 0.2s;
  }
  .btn-theme:hover { background: var(--border); }

  /* FAB — substituiu o botão do header */
  .fab {
    position: fixed;
    bottom: calc(var(--nav-height) + 16px + env(safe-area-inset-bottom, 0px));
    right: 1.25rem;
    z-index: 100;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(247,118,142,0.45);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.18s, box-shadow 0.18s;
    -webkit-tap-highlight-color: transparent;
  }
  .fab:active { transform: scale(0.92); box-shadow: 0 2px 10px rgba(247,118,142,0.3); }

  /* Bottom Nav */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 90;
    height: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: rgba(22,22,30,0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    padding-top: 10px;
  }
  .nav-btn {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: transparent; border: none; cursor: pointer;
    color: var(--text-dim);
    font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 500;
    letter-spacing: 0.02em;
    transition: color 0.15s;
    padding: 0 4px;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-btn .nav-icon {
    font-size: 20px; line-height: 1;
    transition: transform 0.2s;
  }
  .nav-btn.active { color: var(--accent); }
  .nav-btn.active .nav-icon { transform: scale(1.12); }
  .nav-btn:not(.active):active .nav-icon { transform: scale(0.9); }

  #setup-banner {
    background: var(--setup-bg);
    border-bottom: 1px solid var(--setup-border);
    padding: 1rem 1.25rem;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  #setup-banner p { font-size: 13px; color: var(--setup-text); flex-shrink: 0; }
  #setup-banner input {
    flex: 1; min-width: 220px; padding: 8px 14px;
    border: 1px solid var(--setup-border); border-radius: var(--radius-pill);
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    background: var(--setup-input-bg); color: var(--setup-text);
  }
  #setup-banner .btn-sm {
    padding: 8px 18px; border-radius: var(--radius-pill);
    border: 1px solid var(--setup-border); background: transparent;
    color: var(--setup-text); font-size: 13px; font-family: 'DM Sans', sans-serif;
    cursor: pointer; white-space: nowrap; transition: all 0.15s;
  }
  #setup-banner .btn-sm:hover { background: var(--setup-border); color: var(--text); }

  main { max-width: 860px; margin: 0 auto; padding: 1.5rem 1.25rem; }

  /* ── Pages Section ── */
  .pages-section { margin-bottom: 2rem; }
  .section-title {
    font-family: 'Playfair Display', serif; font-size: 16px;
    font-weight: 500; color: var(--text); margin-bottom: 12px;
    display: block;
  }
  .pages-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    box-shadow: var(--shadow-card);
  }
  .pages-tabs {
    display: flex; border-bottom: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: none;
  }
  .pages-tabs::-webkit-scrollbar { display: none; }
  .pages-tab {
    padding: 10px 18px; font-family: 'DM Sans', sans-serif; font-size: 13px;
    background: transparent; border: none; color: var(--text-dim);
    cursor: pointer; border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: all 0.15s; white-space: nowrap;
  }
  .pages-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
  .pages-tab:hover:not(.active) { color: var(--text); }
  .pages-body { padding: 1.25rem 1.5rem; }
  .pages-big { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .pages-number {
    font-family: 'Playfair Display', serif; font-size: 52px;
    font-weight: 600; color: var(--text); line-height: 1;
  }
  .pages-unit { font-size: 16px; color: var(--text-dim); }
  .pages-subtitle {
    font-size: 12px; color: var(--text-dim);
    letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 1rem;
  }
  .pages-breakdown {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px; margin-top: 12px;
  }
  .pages-breakdown-item {
    background: var(--cream); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 12px; text-align: center;
  }
  .pages-breakdown-num {
    font-family: 'Playfair Display', serif; font-size: 22px;
    font-weight: 500; color: var(--text); line-height: 1;
  }
  .pages-breakdown-label {
    font-size: 11px; color: var(--text-dim); margin-top: 3px;
    letter-spacing: 0.03em; text-transform: uppercase;
  }
  .pages-add-section {
    margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .pages-add-label { font-size: 12px; color: var(--text-dim); font-style: italic; }

  /* ── Annual Goal ── */
  .annual-section { margin-bottom: 2rem; }
  .annual-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; gap: 12px; flex-wrap: wrap;
  }
  .annual-title {
    font-family: 'Playfair Display', serif; font-size: 16px;
    font-weight: 500; color: var(--text);
  }
  .year-selector { display: flex; align-items: center; gap: 6px; }
  .year-selector button {
    width: 30px; height: 30px; border: 1px solid var(--border);
    border-radius: 50%; background: transparent; cursor: pointer;
    font-size: 14px; color: var(--text-dim);
    display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .year-selector button:hover { background: var(--cream); color: var(--text); }
  .year-selector span {
    font-size: 15px; font-weight: 500; color: var(--text);
    min-width: 44px; text-align: center;
  }
  .goal-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.25rem 1.5rem;
    box-shadow: var(--shadow-card);
  }
  .goal-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;
  }
  .goal-numbers { display: flex; align-items: baseline; gap: 6px; }
  .goal-count {
    font-family: 'Playfair Display', serif; font-size: 36px;
    font-weight: 600; color: var(--text); line-height: 1;
  }
  .goal-sep { font-size: 20px; color: var(--text-dim); }
  .goal-target {
    font-family: 'Playfair Display', serif; font-size: 28px;
    font-weight: 400; color: var(--text-dim); line-height: 1;
  }
  .goal-label { font-size: 12px; color: var(--text-dim); letter-spacing: 0.04em; text-transform: uppercase; margin-top: 4px; }
  .goal-set { display: flex; align-items: center; gap: 6px; }
  .goal-set input {
    width: 64px; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif;
    font-size: 14px; text-align: center; background: var(--cream); color: var(--text);
  }
  .goal-set input:focus { outline: none; border-color: var(--accent); }
  .goal-set button {
    padding: 8px 14px; border: 1px solid var(--accent); border-radius: var(--radius-pill);
    background: transparent; color: var(--accent); font-size: 12px;
    font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .goal-set button:hover { background: var(--accent); color: #fff; }
  .goal-bar-wrap { margin-bottom: 10px; }
  .goal-bar-track {
    height: 10px; background: var(--cream); border-radius: 5px;
    overflow: hidden; margin-bottom: 6px;
  }
  .goal-bar-fill { height: 100%; border-radius: 5px; transition: width 0.5s ease; }
  .goal-bar-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); }
  .goal-msg { font-size: 13px; font-style: italic; color: var(--text-dim); margin-top: 6px; }
  .goal-msg.achieved { color: #9ece6a; font-style: normal; font-weight: 500; }

  .year-history {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px; margin-top: 1rem;
  }
  .year-chip {
    background: var(--cream); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 10px;
    text-align: center; cursor: pointer; transition: all 0.15s;
  }
  .year-chip:hover { border-color: var(--accent); }
  .year-chip.active-year { border-color: var(--accent); background: var(--accent-light); }
  .year-chip-num { font-size: 13px; font-weight: 500; color: var(--text); }
  .year-chip-count { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  /* ── Stats ── */
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px; margin-bottom: 1.5rem;
  }
  .stat {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1rem 1.25rem; text-align: center;
    box-shadow: var(--shadow-card);
  }
  .stat-num {
    font-family: 'Playfair Display', serif; font-size: 32px;
    font-weight: 600; color: var(--text); line-height: 1;
  }
  .stat-label { font-size: 12px; color: var(--text-dim); margin-top: 4px; letter-spacing: 0.04em; text-transform: uppercase; }

  /* ── Search Bar ── */
  .search-wrap { margin-bottom: 1rem; }
  .search-bar {
    display: flex; align-items: center; gap: 8px;
    background: var(--cream); border: 1px solid var(--border);
    border-radius: var(--radius-pill); padding: 0 16px; height: 44px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-bar:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
  }
  .search-icon { font-size: 15px; color: var(--text-dim); flex-shrink: 0; }
  .search-bar input {
    flex: 1; background: transparent; border: none; outline: none;
    font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text);
  }
  .search-bar input::placeholder { color: var(--text-dim); }
  .search-clear {
    background: transparent; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 16px; padding: 0; line-height: 1;
    display: none; flex-shrink: 0;
  }
  .search-clear.visible { display: block; }

  /* ── Tabs ── */
  .tabs {
    display: flex; gap: 0; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    padding: 8px 18px; font-family: 'DM Sans', sans-serif; font-size: 14px;
    background: transparent; border: none; color: var(--text-dim); cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s;
    white-space: nowrap; flex-shrink: 0;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
  .tab-btn:hover:not(.active) { color: var(--text); }

  /* ── Books ── */
  .books { display: flex; flex-direction: column; gap: 10px; }
  .book-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.1rem 1.25rem;
    box-shadow: var(--shadow-card);
    transition: box-shadow 0.2s, border-color 0.2s, transform 0.15s;
  }
  .book-card:hover { box-shadow: var(--shadow); border-color: var(--border-light); transform: translateY(-1px); }
  .book-card:active { transform: translateY(0); }
  .book-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .book-info { flex: 1; min-width: 0; }
  .book-title {
    font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 500;
    color: var(--text); margin-bottom: 3px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .book-meta { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
  .badge {
    display: inline-block; font-size: 10px; font-weight: 500;
    padding: 2px 8px; border-radius: 20px; letter-spacing: 0.03em;
    text-transform: uppercase; margin-left: 8px; vertical-align: middle;
  }
  .badge-lendo { background: var(--blue-tn-light); color: var(--blue-tn); }
  .badge-concluido { background: var(--green-light); color: var(--green); }
  .badge-pausado { background: var(--amber-light); color: var(--amber); }
  .badge-fisico { background: var(--blue-tn-light); color: var(--blue-tn); font-size: 9px; }
  .badge-ebook  { background: var(--green-light); color: var(--green); font-size: 9px; }
  .book-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-icon {
    width: 32px; height: 32px; border: 1px solid var(--border); background: transparent;
    border-radius: 50%; cursor: pointer; font-size: 13px; color: var(--text-dim);
    display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .btn-icon:hover { background: var(--cream); color: var(--text); }
  .btn-icon.del:hover { background: #2a0f0f; color: #f7768e; border-color: #5a1a1a; }

  /* ── Progress ── */
  .progress-wrap { margin-top: 8px; }
  .progress-track {
    height: 7px; background: var(--cream); border-radius: 4px;
    overflow: hidden; margin-bottom: 6px;
  }
  .progress-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
  .progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }

  /* MOBILE FIX: quick-progress */
  .quick-progress {
    display: flex; align-items: center; gap: 10px;
    background: var(--cream); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 14px; margin-top: 8px;
    flex-wrap: wrap;
  }
  .quick-progress label {
    font-size: 11px; color: var(--text-dim); white-space: nowrap;
    letter-spacing: 0.04em; text-transform: uppercase; flex-shrink: 0;
  }
  .quick-progress input[type=range] {
    flex: 1; min-width: 80px; accent-color: var(--accent); height: 4px; cursor: pointer;
  }
  .quick-progress .pct-badge {
    font-size: 13px; font-weight: 500; color: var(--text);
    min-width: 36px; text-align: right; flex-shrink: 0;
  }
  .quick-progress .btn-save-pct {
    padding: 6px 14px; border: 1px solid var(--accent); border-radius: var(--radius-pill);
    background: transparent; color: var(--accent); font-size: 12px;
    font-family: 'DM Sans', sans-serif; cursor: pointer; flex-shrink: 0;

  /* ── Empty / Toast / Modal ── */

  #toast {

  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);

  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--border-light);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 1.5rem 1.5rem;

  }
  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  /* drag handle */
  .modal::before {
    content: '';
    display: block;
    width: 40px; height: 4px;
    border-radius: 2px;
    background: var(--border-light);
    margin: 0 auto 1.25rem;
  }
  .modal h2 {
    font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 500;
    margin-bottom: 1.25rem; color: var(--text);
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; font-weight: 500; color: var(--text-dim); letter-spacing: 0.04em; text-transform: uppercase; }
  .field input, .field select {
    padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif; font-size: 14px;

  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field select option { background: var(--cream); color: var(--text); }
  .modal-footer {
    display: flex; justify-content: flex-end; gap: 8px;
    margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid var(--border);
  }
  .btn-cancel {
    padding: 10px 20px; border: 1px solid var(--border); border-radius: var(--radius-pill);
    background: transparent; font-family: 'DM Sans', sans-serif;
    font-size: 14px; cursor: pointer; color: var(--text-dim);
  }
  .btn-cancel:hover { background: var(--cream); color: var(--text); }
  .btn-save {
    padding: 10px 24px; border: none; border-radius: var(--radius-pill);

  .spinner {

  @keyframes spin { to { transform: rotate(360deg); } }


  /* ── Chart ── */
  .chart-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.25rem 1.5rem;

    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .chart-legend-item {
    display: flex; align-items: center; gap: 5px;

  }
  canvas#pages-chart {
    width: 100%; display: block; cursor: pointer;

  .chart-tooltip {

    border-radius: var(--radius-sm); padding: 8px 12px;

  .chart-tooltip.visible { opacity: 1; }

  [data-theme="light"] .chart-card {

  /* ── Records ── */

  .rec-dia::before { background: #f7768e; } .rec-semana::before { background: #7aa2f7; } .rec-mes::before { background: #9ece6a; } .rec-ano::before { background: #e0af68; }
  .record-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
  .rec-dia .record-label { color: #f7768e; } .rec-semana .record-label { color: #7aa2f7; } .rec-mes .record-label { color: #9ece6a; } .rec-ano .record-label { color: #e0af68; }
  .record-value { font-family: "Playfair Display", serif; font-size: 26px; font-weight: 600; color: var(--text); line-height: 1; }

<script>
  const API_KEY   = 'ebook_api_url';
  const GOALS_KEY = 'ebook_goals';
  const THEME_KEY = 'minha_estante_theme';

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    const btn = document.getElementById('btn-theme');
    if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    const mc = document.querySelector('meta[name="theme-color"]');
    if (mc) mc.setAttribute('content', theme === 'dark' ? '#16161e' : '#c4c5ca');
    localStorage.setItem(THEME_KEY, theme);
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(current === 'dark' ? 'light' : 'dark');
    // Redesenha o gráfico com as novas cores
    requestAnimationFrame(drawChart);
  }

  // Apply saved theme on load
  applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

  let apiUrl   = localStorage.getItem(API_KEY) || '';
  let books    = [];
  let editingId  = null;
  let currentTab = 'Lendo';
  let selectedYear = new Date().getFullYear();
  let goals    = JSON.parse(localStorage.getItem(GOALS_KEY) || '{}');
  let currentPagesTab = 'hoje';
  let avgPagesPerDay = 0; // calculado do histórico total

  /* ── Date helpers ── */
  // ⚠️ Não usar toISOString() — ela retorna UTC e pode virar "amanhã" após 21h no Brasil.
  // Usamos o horário LOCAL do dispositivo sempre.
  function localDateStr(d = new Date()) {
    const y  = d.getFullYear();
    const m  = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${dd}`;
  }
  function todayStr() { return localDateStr(); }
  function getWeekStart() {
    const d   = new Date();
    const day = d.getDay(); // 0 = Dom
    const diff = d.getDate() - day + (day === 0 ? -6 : 1); // volta pra segunda
    d.setDate(diff);
    return localDateStr(d);
  }
  function getMonthStart() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
  }
  function getYearStart() { return `${new Date().getFullYear()}-01-01`; }

  /* ── Pages logic ── */
  async function registerPagesFromProgress(book, oldPct, newPct) {
    const totalPages = parseInt(book.paginas) || 0;
    if (!totalPages) return 0;
    const diff = newPct - oldPct;
    if (diff <= 0) return 0;
    const pages = Math.round((diff / 100) * totalPages);
    if (pages <= 0) return 0;
    await api({
      action: 'logPages',
      date: todayStr(),
      pages,
      bookId: book.id,
      bookTitle: book.titulo
    });
    return pages;
  }

  function setPagesTab(tab, el) {
    currentPagesTab = tab;
    document.querySelectorAll('.pages-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderPages();
  }

  // Cache de totais para o gráfico
  let pagesTotals = { hoje: 0, semana: 0, mes: 0, ano: 0 };
  let chartAnimFrame = null;
  let allEntriesCache = null; // cache para cálculo de recordes

  async function renderPages() {
    const subtitles = {
      hoje:   'lidas hoje',
      semana: 'lidas esta semana',
      mes:    'lidas este mês',
      ano:    `lidas em ${new Date().getFullYear()}`,
      total:  'lidas no total'
    };
    document.getElementById('pages-subtitle').textContent = subtitles[currentPagesTab];
    document.getElementById('pages-number').textContent = '…';

    try {
      const data    = await api({ action: 'getPages', period: currentPagesTab });
      const entries = data.entries || [];
      const total   = entries.reduce((s, e) => s + (parseInt(e.pages) || 0), 0);
      document.getElementById('pages-number').textContent = total.toLocaleString('pt-BR');

      if (['hoje','semana','mes','ano'].includes(currentPagesTab)) {
        pagesTotals[currentPagesTab] = total;
      }

      const byBook = {};
      entries.forEach(e => {
        const key = e.bookTitle || '(sem livro)';
        byBook[key] = (byBook[key] || 0) + (parseInt(e.pages) || 0);
      });
      const bk   = document.getElementById('pages-breakdown');
      const keys = Object.keys(byBook).sort((a,b) => byBook[b] - byBook[a]);
      bk.innerHTML = keys.slice(0, 6).map(k => `
        <div class="pages-breakdown-item">
          <div class="pages-breakdown-num">${byBook[k].toLocaleString('pt-BR')}</div>
          <div class="pages-breakdown-label">${esc(k.length > 18 ? k.slice(0,16)+'…' : k)}</div>
        </div>`).join('');
    } catch(e) {
      document.getElementById('pages-number').textContent = '—';
    }

    await loadAllPeriodsForChart();
  }

  async function loadAllPeriodsForChart() {
    const periods = ['hoje', 'semana', 'mes', 'ano'];
    const missing = periods.filter(p => pagesTotals[p] === 0 && p !== currentPagesTab);
    try {
      await Promise.all(missing.map(async p => {
        const d = await api({ action: 'getPages', period: p });
        pagesTotals[p] = (d.entries || []).reduce((s, e) => s + (parseInt(e.pages) || 0), 0);
      }));
    } catch(_) {}
    drawChart();
    await renderRecords();
  }

  // ── Helpers de data ──
  function getWeekKeyOf(dateStr) {
    const d   = new Date(dateStr + 'T12:00:00');
    const day = d.getDay();
    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
    d.setDate(diff);
    return localDateStr(d);
  }
  function fmtDate(d) {
    if (!d) return '—';
    const [y,m,dd] = d.split('-');
    const months = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    return `${parseInt(dd)} ${months[parseInt(m)-1]}. ${y}`;
  }
  function fmtMonth(mo) {
    if (!mo) return '—';
    const months = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const [y,m] = mo.split('-');
    return `${months[parseInt(m)-1]} ${y}`;
  }

  // ── Recordes ──
  async function renderRecords() {
    const grid = document.getElementById('records-grid');
    if (!grid) return;
    grid.innerHTML = '<div style="color:var(--text-dim);font-size:12px;grid-column:1/-1;padding:8px 0">Calculando recordes…</div>';
    try {
      if (!allEntriesCache) {
        const d = await api({ action: 'getPages', period: 'total' });
        allEntriesCache = d.entries || [];
      }
      const entries = allEntriesCache;
      if (!entries.length) {
        grid.innerHTML = '<div style="color:var(--text-dim);font-size:12px;grid-column:1/-1;padding:8px 0">Sem histórico ainda.</div>';
        return;
      }

      const today   = todayStr();
      const wkStart = getWeekStart();
      const moStart = today.slice(0,7) + '-01';
      const yrStart = today.slice(0,4) + '-01-01';

      // Recorde DIA
      const byDay = {};
      entries.forEach(e => { if (e.date) byDay[e.date] = (byDay[e.date]||0) + (parseInt(e.pages)||0); });
      const bestDayDate = Object.keys(byDay).reduce((a,b) => byDay[a]>=byDay[b]?a:b, '');
      const bestDayVal  = byDay[bestDayDate] || 0;
      const curDay      = entries.filter(e => e.date===today).reduce((s,e)=>s+(parseInt(e.pages)||0),0);

      // Recorde SEMANA
      const byWeek = {};
      entries.forEach(e => { if (e.date) { const k=getWeekKeyOf(e.date); byWeek[k]=(byWeek[k]||0)+(parseInt(e.pages)||0); }});
      const bestWkKey = Object.keys(byWeek).reduce((a,b) => byWeek[a]>=byWeek[b]?a:b, '');
      const bestWkVal = byWeek[bestWkKey] || 0;
      const curWk     = entries.filter(e => e.date>=wkStart&&e.date<=today).reduce((s,e)=>s+(parseInt(e.pages)||0),0);

      // Recorde MÊS
      const byMonth = {};
      entries.forEach(e => { if (e.date) { const k=e.date.slice(0,7); byMonth[k]=(byMonth[k]||0)+(parseInt(e.pages)||0); }});
      const bestMoKey = Object.keys(byMonth).reduce((a,b) => byMonth[a]>=byMonth[b]?a:b, '');
      const bestMoVal = byMonth[bestMoKey] || 0;
      const curMo     = entries.filter(e => e.date>=moStart&&e.date<=today).reduce((s,e)=>s+(parseInt(e.pages)||0),0);

      // Recorde ANO
      const byYear = {};
      entries.forEach(e => { if (e.date) { const k=e.date.slice(0,4); byYear[k]=(byYear[k]||0)+(parseInt(e.pages)||0); }});
      const bestYrKey = Object.keys(byYear).reduce((a,b) => byYear[a]>=byYear[b]?a:b, '');
      const bestYrVal = byYear[bestYrKey] || 0;
      const curYr     = entries.filter(e => e.date>=yrStart&&e.date<=today).reduce((s,e)=>s+(parseInt(e.pages)||0),0);

      function badge(cur, rec) {
        if (!rec) return '';
        if (cur > 0 && cur >= rec) return `<span class="record-compare is-record">🏆 Recorde atual!</span>`;
        const diff = cur - rec;
        if (diff > 0) return `<span class="record-compare up">▲ +${Math.abs(diff).toLocaleString('pt-BR')} vs recorde</span>`;
        if (diff < 0) return `<span class="record-compare down">▼ faltam ${Math.abs(diff).toLocaleString('pt-BR')} pgs</span>`;
        return `<span class="record-compare same">= Igual ao recorde</span>`;
      }

      grid.innerHTML = `
        <div class="record-card rec-dia">
          <div class="record-label">Melhor dia</div>
          <div class="record-value">${bestDayVal.toLocaleString('pt-BR')}<span class="record-unit"> pgs</span></div>
          <div class="record-date">📅 ${fmtDate(bestDayDate)}</div>
          <div class="record-date" style="margin-top:3px">Hoje: <strong>${curDay.toLocaleString('pt-BR')}</strong> pgs</div>
          ${badge(curDay, bestDayVal)}
        </div>
        <div class="record-card rec-semana">
          <div class="record-label">Melhor semana</div>
          <div class="record-value">${bestWkVal.toLocaleString('pt-BR')}<span class="record-unit"> pgs</span></div>
          <div class="record-date">📅 sem. de ${fmtDate(bestWkKey)}</div>
          <div class="record-date" style="margin-top:3px">Esta sem.: <strong>${curWk.toLocaleString('pt-BR')}</strong> pgs</div>
          ${badge(curWk, bestWkVal)}
        </div>
        <div class="record-card rec-mes">
          <div class="record-label">Melhor mês</div>
          <div class="record-value">${bestMoVal.toLocaleString('pt-BR')}<span class="record-unit"> pgs</span></div>
          <div class="record-date">📅 ${fmtMonth(bestMoKey)}</div>
          <div class="record-date" style="margin-top:3px">Este mês: <strong>${curMo.toLocaleString('pt-BR')}</strong> pgs</div>
          ${badge(curMo, bestMoVal)}
        </div>
        <div class="record-card rec-ano">
          <div class="record-label">Melhor ano</div>
          <div class="record-value">${bestYrVal.toLocaleString('pt-BR')}<span class="record-unit"> pgs</span></div>
          <div class="record-date">📅 ${bestYrKey || '—'}</div>
          <div class="record-date" style="margin-top:3px">Este ano: <strong>${curYr.toLocaleString('pt-BR')}</strong> pgs</div>
          ${badge(curYr, bestYrVal)}
        </div>`;
    } catch(err) {
      const grid = document.getElementById('records-grid');
      if (grid) grid.innerHTML = '<div style="color:var(--text-dim);font-size:12px;grid-column:1/-1">Não foi possível calcular recordes.</div>';
    }
  }

  function drawChart() {
    const canvas = document.getElementById('pages-chart');
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.offsetWidth;
    const H = 180;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
    const colorText    = isDark ? '#c0caf5' : '#3d2b1f';
    const colorDim     = isDark ? '#565f89' : '#9ecfcb';
    const colorGrid    = isDark ? '#292e42' : '#BADFDB';
    const barColors = [
      { base: '#f7768e', light: '#2d1f26' },  // hoje
      { base: '#7aa2f7', light: '#1a2b3c' },  // semana
      { base: '#9ece6a', light: '#1a2b1a' },  // mês
      { base: '#e0af68', light: '#2a2018' },  // ano
    ];

    const labels = ['Hoje', 'Semana', 'Mês', 'Ano'];
    const values = [pagesTotals.hoje, pagesTotals.semana, pagesTotals.mes, pagesTotals.ano];
    const maxVal = Math.max(...values, 1);

    const padL = 44, padR = 12, padT = 12, padB = 36;
    const chartW = W - padL - padR;
    const chartH = H - padT - padB;
    const barCount = 4;
    const barGap = 14;
    const barW = (chartW - barGap * (barCount - 1)) / barCount;

    // Grid lines
    const gridLines = 4;
    ctx.strokeStyle = colorGrid;
    ctx.lineWidth = 1;
    for (let i = 0; i <= gridLines; i++) {
      const y = padT + chartH - (i / gridLines) * chartH;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + chartW, y);
      ctx.stroke();
      // grid labels
      const val = Math.round((i / gridLines) * maxVal);
      ctx.fillStyle = colorDim;
      ctx.font = `10px 'DM Sans', sans-serif`;
      ctx.textAlign = 'right';
      ctx.fillText(val > 999 ? (val/1000).toFixed(1)+'k' : val, padL - 5, y + 3.5);
    }

    // Animate bars
    if (chartAnimFrame) cancelAnimationFrame(chartAnimFrame);
    let progress = 0;
    const duration = 40; // frames
    function animate() {
      progress = Math.min(progress + 1, duration);
      const ease = 1 - Math.pow(1 - progress / duration, 3); // ease-out cubic

      ctx.clearRect(padL, padT, chartW, chartH + 1);

      // redraw grid (clearing wiped it)
      ctx.strokeStyle = colorGrid;
      ctx.lineWidth = 1;
      for (let i = 0; i <= gridLines; i++) {
        const y = padT + chartH - (i / gridLines) * chartH;
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + chartW, y); ctx.stroke();
        ctx.fillStyle = colorDim;
        ctx.font = `10px 'DM Sans', sans-serif`;
        ctx.textAlign = 'right';
        const val = Math.round((i / gridLines) * maxVal);
        ctx.fillText(val > 999 ? (val/1000).toFixed(1)+'k' : val, padL - 5, y + 3.5);
      }

      values.forEach((val, i) => {
        const x = padL + i * (barW + barGap);
        const barH = val > 0 ? Math.max(4, (val / maxVal) * chartH * ease) : 0;
        const y = padT + chartH - barH;
        const color = barColors[i];

        // rounded top bar
        ctx.beginPath();
        const r = Math.min(6, barW / 2, barH);
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + barW - r, y);
        ctx.quadraticCurveTo(x + barW, y, x + barW, y + r);
        ctx.lineTo(x + barW, padT + chartH);
        ctx.lineTo(x, padT + chartH);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        ctx.fillStyle = color.base;
        ctx.globalAlpha = 0.85;
        ctx.fill();
        ctx.globalAlpha = 1;

        // label below
        ctx.fillStyle = colorText;
        ctx.font = `500 11px 'DM Sans', sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(labels[i], x + barW / 2, H - padB + 16);

        // value above bar (only when complete)
        if (progress === duration && val > 0) {
          ctx.fillStyle = colorDim;
          ctx.font = `500 10px 'DM Sans', sans-serif`;
          ctx.textAlign = 'center';
          const display = val > 999 ? (val/1000).toFixed(1)+'k' : val;
          ctx.fillText(display, x + barW / 2, y - 4);
        }
      });

      if (progress < duration) chartAnimFrame = requestAnimationFrame(animate);
    }
    animate();

    // Legend
    const legendEl = document.getElementById('chart-legend');
    if (legendEl) {
      legendEl.innerHTML = labels.map((l, i) => `
        <div class="chart-legend-item">
          <div class="chart-legend-dot" style="background:${barColors[i].base}"></div>
          ${l}
        </div>`).join('');
    }

    // Tooltip on hover/touch
    function getHoveredBar(mx) {
      for (let i = 0; i < 4; i++) {
        const x = padL + i * (barW + barGap);
        if (mx >= x && mx <= x + barW) return i;
      }
      return -1;
    }

    const tooltipEl = document.getElementById('chart-tooltip');
    const periodLabels = ['hoje', 'esta semana', 'este mês', `em ${new Date().getFullYear()}`];

    function showTooltip(mx, my) {
      const rect = canvas.getBoundingClientRect();
      const relX = mx - rect.left;
      const relY = my - rect.top;
      const idx = getHoveredBar(relX);
      if (idx < 0 || relY > H - padB + 8) { tooltipEl.classList.remove('visible'); return; }
      const val = values[idx];
      tooltipEl.innerHTML = `<strong>${val.toLocaleString('pt-BR')} págs</strong>${labels[idx]} — ${periodLabels[idx]}`;
      const tipX = padL + idx * (barW + barGap) + barW / 2;
      const barH = val > 0 ? Math.max(4, (val / maxVal) * chartH) : 0;
      const tipY = padT + chartH - barH - 8;
      tooltipEl.style.left = Math.min(tipX - 60, W - 170) + 'px';
      tooltipEl.style.top  = Math.max(0, tipY - 50) + 'px';
      tooltipEl.classList.add('visible');
    }

    canvas.onmousemove = e => showTooltip(e.clientX, e.clientY);
    canvas.onmouseleave = () => tooltipEl.classList.remove('visible');
    canvas.ontouchmove  = e => { e.preventDefault(); const t = e.touches[0]; showTooltip(t.clientX, t.clientY); };
    canvas.ontouchend   = () => setTimeout(() => tooltipEl.classList.remove('visible'), 1500);
  }

  /* ── Year / Goal logic ── */
  function changeYear(delta) {
    selectedYear += delta;
    document.getElementById('selected-year').textContent = selectedYear;
    document.getElementById('goal-input').value = goals[selectedYear] || '';
    renderGoal(); renderYearHistory();
  }

  function saveGoal() {
    const val = parseInt(document.getElementById('goal-input').value);
    if (!val || val < 1) return toast('Digite uma meta válida.', true);
    goals[selectedYear] = val;
    localStorage.setItem(GOALS_KEY, JSON.stringify(goals));
    renderGoal(); renderYearHistory();
    toast('Meta de ' + selectedYear + ' definida: ' + val + ' livros!');
  }

  function getYearFromDate(d) {
    if (!d) return null;
    if (d.includes('/')) return parseInt(d.split('/')[2]);
    if (d.includes('-')) return parseInt(d.split('-')[0]);
    // formato "08 set. 2025" ou "01 jan. 2026" (Google Sheets)
    const m = String(d).match(/\b(20\d{2})\b/);
    if (m) return parseInt(m[1]);
    return null;
  }

  function renderGoal() {
    const year = selectedYear;
    const concluded = books.filter(b => {
      if (b.status !== 'Concluído') return false;
      const yr = getYearFromDate(b.fim) || getYearFromDate(b.inicio);
      return yr === year;
    }).length;
    const goal = goals[year] || 0;
    document.getElementById('goal-count').textContent  = concluded;
    document.getElementById('goal-target').textContent = goal || '—';
    document.getElementById('goal-input').value        = goal || '';

    const wrap  = document.getElementById('goal-bar-wrap');
    const fill  = document.getElementById('goal-bar-fill');
    const pctEl = document.getElementById('goal-bar-pct');
    const remEl = document.getElementById('goal-bar-remaining');
    const msgEl = document.getElementById('goal-msg');

    if (!goal) {
      wrap.style.display = 'none';
      msgEl.textContent = 'Defina uma meta para ' + year + ' usando o campo acima.';
      msgEl.className = 'goal-msg'; return;
    }
    wrap.style.display = 'block';
    const pct  = Math.min(100, Math.round((concluded / goal) * 100));
    const rem  = Math.max(0, goal - concluded);
    const barColor = pct >= 100 ? '#9ece6a' : pct >= 60 ? '#7aa2f7' : '#e0af68';
    fill.style.width = pct + '%'; fill.style.background = barColor;
    pctEl.textContent = pct + '%';
    remEl.textContent = rem > 0 ? 'faltam ' + rem + ' livro' + (rem > 1 ? 's' : '') : '✓ meta batida!';

    if (pct >= 100) {
      msgEl.textContent = '🎉 Parabéns! Você bateu sua meta de ' + goal + ' livros em ' + year + '!';
      msgEl.className = 'goal-msg achieved';
    } else if (pct >= 75) {
      msgEl.textContent = 'Quase lá! Só faltam ' + rem + ' livro' + (rem > 1 ? 's' : '') + ' para bater a meta.';
      msgEl.className = 'goal-msg';
    } else if (concluded > 0) {
      msgEl.textContent = 'Continue assim — você já leu ' + concluded + ' de ' + goal + ' livros.';
      msgEl.className = 'goal-msg';
    } else {
      msgEl.textContent = 'Nenhum livro concluído em ' + year + ' ainda. Bora começar!';
      msgEl.className = 'goal-msg';
    }
  }

  function renderYearHistory() {
    const yearsWithBooks = {};
    books.forEach(b => {
      if (b.status !== 'Concluído') return;
      const yr = getYearFromDate(b.fim) || getYearFromDate(b.inicio);
      if (yr) yearsWithBooks[yr] = (yearsWithBooks[yr] || 0) + 1;
    });
    Object.keys(goals).forEach(y => { if (!yearsWithBooks[y]) yearsWithBooks[y] = 0; });
    const years = Object.keys(yearsWithBooks).map(Number).sort((a,b) => b - a);
    const container = document.getElementById('year-history');
    if (!years.length) { container.innerHTML = ''; return; }
    container.innerHTML = years.map(yr => {
      const count = yearsWithBooks[yr] || 0, g = goals[yr];
      const label = g ? count + '/' + g : count + ' lido' + (count !== 1 ? 's' : '');
      return `<div class="year-chip ${yr === selectedYear ? 'active-year' : ''}" onclick="jumpToYear(${yr})">
        <div class="year-chip-num">${yr}</div>
        <div class="year-chip-count">${label}</div>
      </div>`;
    }).join('');
  }

  function jumpToYear(yr) {
    selectedYear = yr;
    document.getElementById('selected-year').textContent = yr;
    document.getElementById('goal-input').value = goals[yr] || '';
    renderGoal(); renderYearHistory();
  }

  function saveApiUrl() {
    const val = document.getElementById('api-url-input').value.trim();
    if (!val) return toast('Cole a URL do Apps Script primeiro.', true);
    apiUrl = val;
    localStorage.setItem(API_KEY, val);

  async function api(params) {
    if (!apiUrl) { toast('Configure a URL do Apps Script primeiro.', true); return; }
    const url = apiUrl + '?' + new URLSearchParams(params);
    const res  = await fetch(url);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return data;
  }

  async function loadBooks() {
    try {
      const [booksData, pagesData] = await Promise.all([
        api({ action: 'getAll' }),
        api({ action: 'getPages', period: 'total' })
      ]);
      books = booksData.books || [];
      computeAvgPagesPerDay(pagesData.entries || []);
      render();
    } catch (e) { toast('Erro ao carregar: ' + e.message, true); }
  }

  function computeAvgPagesPerDay(entries) {
    if (!entries.length) { avgPagesPerDay = 0; return; }
    const total = entries.reduce((s, e) => s + (parseInt(e.pages) || 0), 0);
    // dias únicos com leitura
    const days = new Set(entries.map(e => e.date)).size;
    avgPagesPerDay = days > 0 ? total / days : 0;
  }

  function estimateFinish(book) {
    if (avgPagesPerDay <= 0) return null;
    const totalPages = parseInt(book.paginas) || 0;
    if (!totalPages) return null;
    const pct = parseInt(book.progresso) || 0;
    const pagesRead = Math.round((pct / 100) * totalPages);
    const remaining = totalPages - pagesRead;
    if (remaining <= 0) return null;
    const days = Math.ceil(remaining / avgPagesPerDay);
    const finish = new Date();
    finish.setDate(finish.getDate() + days);
    const months = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    const dateStr = `${finish.getDate()} ${months[finish.getMonth()]} ${finish.getFullYear()}`;
    return { days, dateStr, remaining, avg: Math.round(avgPagesPerDay) };
  }

  function renderStats() {
    const total = books.length;
    const lendo = books.filter(b => b.status === 'Lendo').length;
    const concluidos = books.filter(b => b.status === 'Concluído').length;
    const pausados   = books.filter(b => b.status === 'Pausado').length;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="stat-num">${total}</div><div class="stat-label">Total</div></div>
      <div class="stat"><div class="stat-num">${lendo}</div><div class="stat-label">Lendo</div></div>
      <div class="stat"><div class="stat-num">${concluidos}</div><div class="stat-label">Concluídos</div></div>
      <div class="stat"><div class="stat-num">${pausados}</div><div class="stat-label">Pausados</div></div>`;
  }

  function renderBooks() {
    const list = document.getElementById('books-list');
    let filtered = currentTab === 'todos' ? books : books.filter(b => b.status === currentTab);
    if (searchQuery) {
      filtered = filtered.filter(b =>
        b.titulo.toLowerCase().includes(searchQuery) ||
        (b.autor || '').toLowerCase().includes(searchQuery)
      );
    }
    if (!filtered.length) {
      const msg = searchQuery ? `Nenhum livro encontrado para "<strong>${esc(searchQuery)}</strong>".` : 'Nenhum livro aqui ainda.';
      list.innerHTML = `<div class="empty"><div class="empty-icon">📚</div><p>${msg}</p></div>`;
      return;
    }
    list.innerHTML = filtered.map(b => {
      const pct = Math.min(100, Math.max(0, parseInt(b.progresso) || 0));
      const barColor   = pct === 100 ? '#9ece6a' : pct > 50 ? '#7aa2f7' : '#e0af68';
      const badgeClass = b.status === 'Lendo' ? 'badge-lendo' : b.status === 'Concluído' ? 'badge-concluido' : 'badge-pausado';
      const meta    = [b.autor, b.edicao, b.paginas ? b.paginas + ' págs' : ''].filter(Boolean).join(' · ');
      const periodo = [fmtDate(b.inicio) && 'Início: ' + fmtDate(b.inicio), fmtDate(b.fim) && 'Fim: ' + fmtDate(b.fim)].filter(Boolean).join(' · ');
      return `
        <div class="book-card">
          <div class="book-top">
            <div class="book-info">
              <div class="book-title">${esc(b.titulo)}<span class="badge ${badgeClass}">${b.status}</span><span class="badge ${b.tipo === 'Físico' ? 'badge-fisico' : 'badge-ebook'}">${b.tipo || 'Ebook'}</span></div>
              <div class="book-meta">${[meta, periodo].filter(Boolean).join(' · ')}</div>
            </div>
            <div class="book-actions">
              <button class="btn-icon" onclick='openEdit(${JSON.stringify(b)})' title="Editar">✎</button>
              <button class="btn-icon del" onclick="deleteBook(${b.id})" title="Remover">✕</button>
            </div>
          </div>
          <div class="progress-wrap">
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${barColor}"></div></div>
            <div class="progress-label"><span>${pct}% lido</span><span>${pct === 100 ? '✓ Concluído' : ''}</span></div>
            ${b.tipo === 'Físico' && b.paginas ? `
            <div class="quick-progress">
              <label>Página atual</label>
              <input type="number" min="0" max="${b.paginas}" id="pagina-atual-${b.id}"
                value="${Math.round((pct/100)*parseInt(b.paginas))}"
                style="width:80px;padding:5px 8px;background:var(--cream);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;text-align:center;"
                oninput="syncSliderFromPage(${b.id}, ${b.paginas})" />
              <span style="font-size:12px;color:var(--text-dim)">de ${b.paginas}</span>
              <span class="pct-badge" id="pct-${b.id}">${pct}%</span>
              <button class="btn-save-pct" onclick="saveProgress(${b.id}, '${esc(b.titulo)}')">Salvar</button>
            </div>` : `
            <div class="quick-progress">
              <label>Progresso</label>
              <input type="range" min="0" max="100" step="1" value="${pct}" id="slider-${b.id}"
                oninput="document.getElementById('pct-${b.id}').textContent=this.value+'%'" />
              <span class="pct-badge" id="pct-${b.id}">${pct}%</span>
              <button class="btn-save-pct" onclick="saveProgress(${b.id}, '${esc(b.titulo)}')">Salvar</button>
            </div>`}
            ${b.status === 'Lendo' ? (() => {
              const est = estimateFinish(b);
              if (!est) return '';
              return `<div class="estimate-row">
                <span class="estimate-icon">📅</span>
                <span class="estimate-text">
                  Termina em aprox. <strong>${est.days} dia${est.days !== 1 ? 's' : ''}</strong>
                  — por volta de <strong>${est.dateStr}</strong>
                  <br><span style="font-size:11px">${est.remaining} págs restantes</span>
                </span>
                <span class="estimate-avg">${est.avg} págs/dia</span>
              </div>`;
            })() : ''}
          </div>
        </div>`;
    }).join('');
  }

  function fmtDate(d) {
    if (!d) return '';
    if (d.includes('/')) {
      const [day, mo, yr] = d.split('/');
      return `${day} ${['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][parseInt(mo)-1]} ${yr}`;
    }
    if (d.includes('-')) {
      const [yr, mo, day] = d.split('-');
      return `${day} ${['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][parseInt(mo)-1]} ${yr}`;
    }
    return d;
  }

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function onTipoChange() {
    const tipo = document.getElementById('f-tipo').value;
    document.getElementById('field-progresso-pct').style.display = tipo === 'Físico' ? 'none' : '';
    document.getElementById('field-pagina-atual').style.display  = tipo === 'Físico' ? '' : 'none';
  }

  function syncSliderFromPage(id, totalPages) {
    const input = document.getElementById('pagina-atual-' + id);
    const pctEl = document.getElementById('pct-' + id);
    if (!input || !pctEl) return;
    const pct = Math.min(100, Math.round((parseInt(input.value) / totalPages) * 100));
    pctEl.textContent = pct + '%';
    // store computed pct for saveProgress
    input.dataset.pct = pct;
  }

  function openModal() {
    editingId = null;
    document.getElementById('modal-title').textContent = 'Adicionar livro';
    ['titulo','autor','edicao','paginas','progresso','inicio','fim'].forEach(f => document.getElementById('f-'+f).value = '');
    document.getElementById('f-pagina-atual').value = '';
    document.getElementById('f-tipo').value = 'Ebook';
    onTipoChange();
    document.getElementById('f-status').value = 'Lendo';
    document.getElementById('modal-overlay').classList.add('open');
  }

  function openEdit(book) {
    editingId = book.id;
    document.getElementById('modal-title').textContent = 'Editar livro';
    document.getElementById('f-titulo').value    = book.titulo || '';
    document.getElementById('f-autor').value     = book.autor || '';
    document.getElementById('f-edicao').value    = book.edicao || '';
    document.getElementById('f-paginas').value   = book.paginas || '';
    document.getElementById('f-progresso').value = book.progresso || '';
    document.getElementById('f-status').value    = book.status || 'Lendo';
    document.getElementById('f-tipo').value      = book.tipo || 'Ebook';
    onTipoChange();
    if (book.tipo === 'Físico' && book.paginas) {
      document.getElementById('f-pagina-atual').value = Math.round(((parseInt(book.progresso)||0)/100)*parseInt(book.paginas));
    }
    document.getElementById('f-inicio').value    = toInputDate(book.inicio);
    document.getElementById('f-fim').value       = toInputDate(book.fim);
    document.getElementById('modal-overlay').classList.add('open');
  }

  function toInputDate(d) {
    if (!d) return '';
    if (d.includes('-') && d.length === 10) return d;
    if (d.includes('/')) {
      const [day, mo, yr] = d.split('/');
      return `${yr}-${mo.padStart(2,'0')}-${day.padStart(2,'0')}`;
    }
    return '';
  }

  function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

  async function saveBook() {
    const titulo = document.getElementById('f-titulo').value.trim();
    if (!titulo) return toast('Título é obrigatório.', true);
    const tipo = document.getElementById('f-tipo').value;
    let progresso = document.getElementById('f-progresso').value.trim() || '0';
    if (tipo === 'Físico') {
      const paginaAtual = parseInt(document.getElementById('f-pagina-atual').value) || 0;
      const totalPags   = parseInt(document.getElementById('f-paginas').value) || 0;
      progresso = totalPags > 0 ? String(Math.min(100, Math.round((paginaAtual / totalPags) * 100))) : '0';
    }
    const book = {
      titulo, autor: document.getElementById('f-autor').value.trim(), tipo,
      edicao: document.getElementById('f-edicao').value.trim(),
      paginas: document.getElementById('f-paginas').value.trim(),
      progresso,
      status: document.getElementById('f-status').value,
      inicio: document.getElementById('f-inicio').value ? fmtDate(document.getElementById('f-inicio').value) : '',
      fim:    document.getElementById('f-fim').value    ? fmtDate(document.getElementById('f-fim').value)    : ''
    };
    const btn = document.getElementById('btn-save');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Salvando...';
    try {
      if (editingId) {
        await api({ action: 'update', id: editingId, ...book });
        const idx = books.findIndex(b => b.id === editingId);
        if (idx !== -1) books[idx] = { ...book, id: editingId };
        toast('Livro atualizado!');
      } else {
        const res = await api({ action: 'add', ...book });
        books.push({ ...book, id: res.id });
        toast('Livro adicionado!');
      }
      closeModal(); render();
    } catch (e) { toast('Erro ao salvar: ' + e.message, true); }
    finally { btn.disabled = false; btn.textContent = 'Salvar'; }
  }

  async function saveProgress(id, titulo) {
    const slider = document.getElementById('slider-' + id);
    const pageInput2 = document.getElementById('pagina-atual-' + id);
    if (!slider && !pageInput2) return;
    // for physical books, pct comes from page input's dataset
    const pageInput = document.getElementById('pagina-atual-' + id);
    const newPct = pageInput
      ? parseInt(pageInput.dataset.pct ?? pageInput.value ?? 0)
      : parseInt(slider ? slider.value : 0);
    const book   = books.find(b => b.id === id);
    if (!book) return;
    const oldPct = parseInt(book.progresso) || 0;
    try {
      await api({ action: 'update', id, ...book, progresso: newPct });
      const pagesAdded = await registerPagesFromProgress(book, oldPct, newPct);
      book.progresso = newPct; render();
      if (pagesAdded > 0) {
        toast(`Progresso salvo! +${pagesAdded} páginas registradas.`);
      } else {
        toast('Progresso de "' + titulo + '" atualizado para ' + newPct + '%!');
      }
    } catch (e) { toast('Erro ao salvar progresso: ' + e.message, true); }
  }

  async function deleteBook(id) {
    if (!confirm('Remover este livro?')) return;
    try {
      await api({ action: 'delete', id });
      books = books.filter(b => b.id !== id); render();
      toast('Livro removido.');
    } catch (e) { toast('Erro ao remover: ' + e.message, true); }
  }

  let toastTimer;
  function toast(msg, isErr = false) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.className = 'show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.className = '', 3500);
  }

  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
</script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker registrado'))
          .catch(err => console.warn('SW falhou:', err));
      });
    }
  </script>
</body>
</html>
